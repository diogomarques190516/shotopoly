<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B14CFF"/>
      <stop offset="55%" stop-color="#7B3FE4"/>
      <stop offset="100%" stop-color="#3D1B6B"/>
    </linearGradient>
    <linearGradient id="liqGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE566"/>
      <stop offset="100%" stop-color="#FFC300"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="45%" stop-color="rgba(255,255,255,0.04)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="1024" height="1024" rx="229" ry="229" fill="url(#bgGrad)"/>

  <!-- Glass body liquid fill (trapezoid) -->
  <polygon points="232,188 792,188 660,664 364,664" fill="url(#liqGrad)"/>

  <!-- Glass shine on left side -->
  <polygon points="232,188 400,188 300,664 364,664" fill="url(#shineGrad)"/>

  <!-- Die pips — 5-face pattern in dark purple -->
  <circle cx="392" cy="306" r="34" fill="#2D0B58"/>
  <circle cx="632" cy="306" r="34" fill="#2D0B58"/>
  <circle cx="512" cy="426" r="34" fill="#2D0B58"/>
  <circle cx="392" cy="546" r="34" fill="#2D0B58"/>
  <circle cx="632" cy="546" r="34" fill="#2D0B58"/>

  <!-- Glass outline — top rim -->
  <line x1="232" y1="188" x2="792" y2="188" stroke="#FFE066" stroke-width="22" stroke-linecap="round"/>
  <!-- Left side -->
  <line x1="232" y1="188" x2="364" y2="664" stroke="#FFE066" stroke-width="22" stroke-linecap="round"/>
  <!-- Right side -->
  <line x1="792" y1="188" x2="660" y2="664" stroke="#FFE066" stroke-width="22" stroke-linecap="round"/>
  <!-- Bottom of body -->
  <line x1="364" y1="664" x2="660" y2="664" stroke="#FFE066" stroke-width="22" stroke-linecap="round"/>

  <!-- Stem -->
  <rect x="416" y="664" width="192" height="54" fill="#FFE066"/>
  <!-- Inner base -->
  <rect x="336" y="718" width="352" height="48" rx="8" fill="#FFE066"/>
  <!-- Outer foot -->
  <rect x="260" y="766" width="504" height="52" rx="18" fill="#FFE066"/>
</svg>
